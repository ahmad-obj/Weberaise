name: Temporary zero-quality performance verification

on:
  push:
    branches:
      - perf/zero-quality-optimization

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run EXPLORE prominence contract
        run: node --test tests/explore-button-prominence.test.mjs
