name: Temporary mobile static hero verification

on:
  push:
    branches:
      - perf/zero-quality-optimization

jobs:
  verify-mobile-static-hero:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused mobile tests
        run: node --import=tsx --test tests/mobile-navigation-contact.test.mjs tests/mobile-static-hero.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
