name: Temporary mobile navigation verification

on:
  push:
    branches:
      - perf/zero-quality-optimization

jobs:
  verify-mobile-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused navigation tests
        run: >-
          node --import=tsx --test
          tests/mobile-navigation-contact.test.mjs
          tests/navigation.test.mjs
          tests/navigation-unified-flood.test.mjs
          tests/final-integration.test.mjs
          tests/services-contact-ending.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build
